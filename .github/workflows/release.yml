# Creates the GitHub release when a vX.Y.Z tag is pushed. The notes come from the matching
# CHANGELOG.md section; the job fails if that section is missing or gogemini.Version differs.
name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check changelog and version
        run: python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" --check > "$RUNNER_TEMP/notes.md"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it as it is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
