name: Go test workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
permissions:
  contents: read
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the go.mod floor, plus whatever is current
        go-version: [ '1.26.x', 'stable' ]
    #
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      #
      - name: Display Go version
        run: go version
      #
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      #
      - name: Vet
        run: go vet ./...
      #
      - name: Test with the Go CLI
        run: go test -v -race ./...
      #
      # Public API must stay covered: fail below 90% on the gogemini package.
      - name: Coverage gate
        run: |
          pct=$(go test -count=1 -cover ./gogemini/ | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')
          echo "gogemini coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p >= 90) ? 0 : 1 }' || { echo "::error::gogemini coverage ${pct}% is below 90%"; exit 1; }
      #
      # Tool versions are pinned; bump them on purpose.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      #
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      #
    #
  #
#

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # From v1.0.0 on, an incompatible change to the exported API fails the build.
  # Before v1.0.0 it is only reported, since minor versions may still break.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gorelease against the latest tag
        # Decide from the report, not from gorelease's exit code: it exits 1 whenever it cannot
        # suggest a version, e.g. right after a tag while the Go proxy has not seen it yet.
        # On a tagged commit, compare with the previous tag. The report goes to RUNNER_TEMP:
        # a file in the checkout makes gorelease refuse to run ("uncommitted changes").
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*.*.*')" ]; then
            base=$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^ 2>/dev/null || true)
          else
            base=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then echo "no earlier release tag"; exit 0; fi
          report="$RUNNER_TEMP/gorelease.txt"
          rc=0
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260908205506-85c1c2202aba -base="$base" > "$report" 2>&1 || rc=$?
          cat "$report"
          if ! grep -q '^# summary' "$report"; then
            echo "::error::gorelease produced no report (exit $rc)"; exit 1
          fi
          if grep -q '^## incompatible changes' "$report"; then
            case "$base" in
              v0.*) echo "::warning::incompatible API changes since $base (allowed before v1.0.0)";;
              *)    echo "::error::incompatible API changes since $base"; exit 1;;
            esac
          fi
