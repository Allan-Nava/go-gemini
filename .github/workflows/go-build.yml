name: Go build
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
permissions:
  contents: read
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the go.mod floor, plus whatever is current
        go-version: [ '1.26.x', 'stable' ]
    steps:
    - uses: actions/checkout@v7
    #
    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    #
    - name: Build
      run: go build -v ./...
    #
  #
